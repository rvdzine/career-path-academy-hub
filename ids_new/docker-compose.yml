services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.idigitalstudies.com/api
        NEXT_PUBLIC_SITE_URL: https://idigitalstudies.com
    container_name: ids_nextjs_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3020}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.idigitalstudies.com/api
      - NEXT_PUBLIC_SITE_URL=https://idigitalstudies.com
